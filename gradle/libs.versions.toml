[versions]

kotlin = "2.4.10"

plugin-agp = "9.3.2"

hilt = "2.60.1"
hilt-androidx = "1.4.0"

ksp = "2.3.11"

kotlinx-coroutines-core = "1.9.0"
kotlinx-coroutines-test = "1.11.0"
kotlinx-serialization-json = "1.11.0"

testing-mockito-kotlin = "5.4.0"

androidTools = "31.13.2"

androidx-navigation-ui-ktx = "2.8.4"
androidx-navigation-fragment-ktx = "2.8.4"
androidx-preference-ktx = "1.2.1"
androidx-core-ktx = "1.19.0"
androidx-core-splashscreen = "1.2.0"
androidx-activity-ktx = "1.13.0"
androidx-fragment-ktx = "1.9.0"

androidx-material = "1.14.0"
androidx-documentfile = "1.0.1"
androidx-media = "1.7.0"
androidx-lifecycle = "2.8.7"
androidx-workmanager = "2.11.2"
androidx-startup = "1.2.0"
androidx-constraintLayout = "2.2.2"
androidx-appcompat = "1.8.0"

androidx-testing-core = "1.6.1"
androidx-testing-runner = "1.6.2"
androidx-testing-rules = "1.7.0"
androidx-testing-orchestrator = "1.6.1"
androidx-testing-junit = "1.3.0"
androidx-testing-espresso = "3.6.1"
robolectric = "4.16.1"

compose-coil = "2.7.0"
compose-activity = "1.9.3"
compose-lazyColumnScrollbar = "2.2.0"
compose-material3Android = "1.3.1"
compose-bom = "2026.08.00"


gson = "2.14.0"
jsoup = "1.23.1"
room = "2.8.4"
junit = "4.13.2"

# Lua and YAML dependencies
luajvm = "3.0.1"
snakeyaml = "2.6"

okhttp = "5.4.0"
okhttp-interceptor-logging = "5.4.0"

readability4j = "1.0.8"

timber = "5.0.1"
kotlin-metadata-jvm = "2.4.10"
sora-editor = "0.24.6"
subsampling-scale-image-view = "3.10.0"
[libraries]

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-androidx-animation = { module = "androidx.compose.animation:animation" }
compose-androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "compose-activity" }
compose-androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-androidx-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
compose-androidx-ui = { module = "androidx.compose.ui:ui" }
compose-androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-lazyColumnScrollbar = { module = "com.github.nanihadesuka:LazyColumnScrollbar", version.ref = "compose-lazyColumnScrollbar" }
compose-coil = { module = "io.coil-kt:coil-compose", version.ref = "compose-coil" }
coil = { module = "io.coil-kt:coil", version.ref = "compose-coil" }
compose-material3-android = { group = "androidx.compose.material3", name = "material3-android", version.ref = "compose-material3Android" }

# Hilt
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-workmanager = { module = "androidx.hilt:hilt-work", version.ref = "hilt-androidx" }
hilt-androidx-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-androidx" }

# Room
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

#Networking
okhttp-interceptor-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp-interceptor-logging" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-interceptor-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }

# Data manipulation (html, serialization, ...)
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# Lua and YAML dependencies
luajvm = { module = "org.luaj:luaj-jse", version.ref = "luajvm" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

# Text extractors
readability4j = { module = "net.dankito.readability4j:readability4j", version.ref = "readability4j" }

# Testing
test-mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "testing-mockito-kotlin" }
test-junit = { module = "junit:junit", version.ref = "junit" }
test-androidx-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidx-testing-orchestrator" }
test-androidx-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-testing-junit" }
test-androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-testing-espresso" }
test-androidx-runner = { module = "androidx.test:runner", version.ref = "androidx-testing-runner" }
test-androidx-rules = { module = "androidx.test:rules", version.ref = "androidx-testing-rules" }
test-androidx-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-testing-core" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-test" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin-metadata-jvm" }

# Android
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintLayout" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment-ktx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity-ktx" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }

androidx-workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-workmanager" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-media = { module = "androidx.media:media", version.ref = "androidx-media" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-navigation-ui-ktx" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-navigation-fragment-ktx" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference-ktx" }

material = { module = "com.google.android.material:material", version.ref = "androidx-material" }

# Sora Editor
sora-editor-bom = { module = "io.github.rosemoe:editor-bom", version.ref = "sora-editor" }
sora-editor-core = { module = "io.github.rosemoe:editor" }

# Subsampling Scale Image View (manga viewer)
subsampling-scale-image-view = { module = "com.davemorrissey.labs:subsampling-scale-image-view", version.ref = "subsampling-scale-image-view" }

# Logging
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

#build-confing deps
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "plugin-agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
[plugins]
android-application = { id = "com.android.application", version.ref = "plugin-agp" }
android-library = { id = "com.android.library", version.ref = "plugin-agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

noveldokusha-android-application = { id = "noveldokusha.android.application", version = "unspecified" }
noveldokusha-android-library = { id = "noveldokusha.android.library", version = "unspecified" }
noveldokusha-android-library-nohilt = { id = "noveldokusha.android.library.nohilt", version = "unspecified" }
noveldokusha-android-compose = { id = "noveldokusha.android.compose", version = "unspecified" }

[bundles]
