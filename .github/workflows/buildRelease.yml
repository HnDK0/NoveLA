name: Build & Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novela-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate APK signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/storeFile.jks \
            -alias novela \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storepass android \
            -keypass android \
            -dname "CN=Vaizero, OU=NoveLA, O=Vaizero, L=Earth, S=Earth, C=US"

          {
            echo "storeFile=storeFile.jks"
            echo "storePassword=android"
            echo "keyAlias=novela"
            echo "keyPassword=android"
          } > custom.properties

      - name: Build optimized release APK
        run: ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties

      - name: Read build information
        run: |
          APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ -z "$APP_VERSION" ]; then
            echo "Unable to detect app version"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Prepare APK
        run: |
          mkdir -p release-artifacts

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          cp "$APK" \
            "release-artifacts/NoveLA-v${APP_VERSION}-Vaizero.apk"

          ls -lah release-artifacts

      - name: Generate release description
        run: |
          {
            echo "# 📖 NoveLA"
            echo ""
            echo "**Free and open-source web novel reader for Android.**"
            echo ""
            echo "## 🧩 Local Lua Extension Tools"
            echo ""
            echo "- 📥 Import local \`.lua\` source extensions directly in NoveLA"
            echo "- ✏️ Edit installed Lua extension code with a lightweight built-in editor"
            echo "- 💾 Save Lua changes locally and reload extensions for quick testing"
            echo "- ♻️ Restore repository extensions to their original Lua source"
            echo "- 🗑️ Delete individual local Lua extensions"
            echo "- 🧹 Clear all locally imported Lua extensions"
            echo ""
            echo "## ✨ Features"
            echo ""
            echo "- 📚 35+ novel sources with built-in and external Lua plugin support"
            echo "- 🔎 Global multi-source novel search and add novels by URL"
            echo "- 🌐 In-reader translation with parallel reading mode"
            echo "- 🌍 Translation support for 226 languages"
            echo "- 🤖 Google Gemini and OpenAI-compatible translation backends"
            echo "- 🔊 Text-to-speech with background playback"
            echo "- 🎛️ Floating TTS player with draggable controls and paragraph display"
            echo "- 🎧 Bluetooth and lock-screen media controls"
            echo "- 🗣️ Original voice selection for parallel mode"
            echo "- 📜 Infinite chapter scrolling with offline caching"
            echo "- 📥 Download all chapters for offline reading"
            echo "- 📖 Local EPUB and FB2 library with bulk import"
            echo "- 🔄 Novel migration between sources"
            echo "- ☁️ Automatic Cloudflare Turnstile bypass"
            echo "- 🧹 Regex text cleanup for ads and injected text"
            echo "- 💾 Backup, restore, and automatic backup support"
            echo "- ⏱️ TTS reading timer"
            echo "- 🌐 20 interface languages"
            echo ""
            echo "## 🛠 Build Information"
            echo ""
            echo "- **Version:** ${APP_VERSION}"
            echo "- **Commit:** \`${SHORT_SHA}\`"
            echo "- **Build type:** Release"
            echo ""
            echo "> ⚠️ This is a modified NoveLA build and is not an official HnDK0 release."
            echo ""
            echo "## 📄 License"
            echo ""
            echo "Based on NoveLA and distributed under the GPL-3.0 license."
            echo ""
            echo "---"
            echo ""
            echo "### 📱 APK by *Insta ID: @vaizero126* — **Vaizero**"
          } > release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NoveLA v${{ env.APP_VERSION }} • Vaizero
          tag_name: vaizero-${{ env.APP_VERSION }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body_path: release-body.md
          files: release-artifacts/*.apk
