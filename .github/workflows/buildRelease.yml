name: Build & Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novela-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore APK signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/storeFile.jks

          cat > custom.properties <<EOF
          storeFile=storeFile.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build optimized release APK
        run: ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties

      - name: Read build information
        run: |
          APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ -z "$APP_VERSION" ]; then
            echo "Unable to detect app version"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Prepare APK
        run: |
          mkdir -p release-artifacts

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          cp "$APK" "release-artifacts/NoveLA-v${APP_VERSION}-Vaizero.apk"
          ls -lah release-artifacts

      - name: Generate release description
        run: |
          git fetch origin --tags --force

          BASE_TAG=$(git tag --sort=-creatordate | head -n 1)

          FEATURES_FILE="$(mktemp)"
          if [ -f README.md ]; then
            awk '
              /^## .*Features/ { in_section=1; next }
              in_section && /^## / { exit }
              in_section && /^- / { print }
            ' README.md > "$FEATURES_FILE"
          fi

          {
            echo "# 📖 NoveLA"
            echo ""
            echo "**Free and open-source web novel reader for Android.**"
            echo ""

            echo "## 🆕 What changed in this build"
            echo ""
            if [ -n "$BASE_TAG" ]; then
              echo "_Changes since \`${BASE_TAG}\`_"
              git log --no-merges --pretty=format:'- %s (%h)' "${BASE_TAG}"..HEAD | sed '/^$/d' | head -n 40
            else
              echo "_Recent changes from the latest commits_"
              git log --no-merges -20 --pretty=format:'- %s (%h)' HEAD | sed '/^$/d'
            fi
            echo ""

            echo "## ✨ Feature highlights"
            echo ""
            if [ -s "$FEATURES_FILE" ]; then
              cat "$FEATURES_FILE" | head -n 30
            else
              echo "- Feature list could not be extracted from README.md"
            fi
            echo ""

            echo "## 🛠 Build Information"
            echo ""
            echo "- **Version:** ${APP_VERSION}"
            echo "- **Commit:** \`${SHORT_SHA}\`"
            echo "- **Build type:** Release"
            echo ""
            echo "> ⚠️ This is a modified NoveLA build and is not an official HnDK0 release."
            echo ""
            echo "## 📄 License"
            echo ""
            echo "Based on NoveLA (@HnDK0) and distributed under the GPL-3.0 license."
            echo ""
            echo "---"
            echo ""
            echo "### 📱 APK by : @vaizero126* — **Vaizero**"
          } > release-body.md

          rm -f "$FEATURES_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NoveLA v${{ env.APP_VERSION }} • Vaizero
          tag_name: vaizero-${{ env.APP_VERSION }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body_path: release-body.md
          files: release-artifacts/*.apk
