name: Nightly Build

on:
  push:
    branches:
      - default
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore APK signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/storeFile.jks

          cat > custom.properties <<EOF
          storeFile=storeFile.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Set app version
        run: |
          APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$APP_VERSION" ]; then
            echo "Unable to detect app version"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties -PsplitByAbi

      - name: Collect APK
        run: |
          mkdir -p release-artifacts

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*arm64-v8a*release.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "arm64 release APK not found"
            ls -lah app/build/outputs/apk/release || true
            exit 1
          fi

          cp "$APK" "release-artifacts/NoveLA-nightly-v${APP_VERSION}-${SHORT_SHA}-arm64.apk"
          ls -lah release-artifacts

      - name: Build changelog
        run: |
          git fetch origin --tags --force

          BASE_TAG=$(git tag --sort=-creatordate | grep -v -x 'nightly' | head -n 1)

          FEATURES_FILE="$(mktemp)"
          if [ -f README.md ]; then
            awk '
              /^## .*Features/ { in_section=1; next }
              in_section && /^## / { exit }
              in_section && /^- / { print }
            ' README.md > "$FEATURES_FILE"
          fi

          {
            echo "# 📖 NoveLA Nightly"
            echo ""
            echo "**Automated nightly build from the latest commit on the \`${{ github.ref_name }}\` branch.**"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Build type:** Nightly"
            echo "- **APK:** arm64-v8a split"
            echo ""

            echo "## 🆕 What changed"
            echo ""
            if [ -n "$BASE_TAG" ]; then
              echo "_Changes since \`${BASE_TAG}\`_"
              git log --no-merges --pretty=format:'- %s (%h)' "${BASE_TAG}"..HEAD | sed '/^$/d' | head -n 40
            else
              echo "_Recent changes from the latest commits_"
              git log --no-merges -20 --pretty=format:'- %s (%h)' HEAD | sed '/^$/d'
            fi
            echo ""

            echo "## ✨ Feature highlights"
            echo ""
            if [ -s "$FEATURES_FILE" ]; then
              cat "$FEATURES_FILE" | head -n 30
            else
              echo "- Feature list could not be extracted from README.md"
            fi
            echo ""

            echo "> ⚠️ This is a nightly build and may contain bugs."
          } > release-body.md

          rm -f "$FEATURES_FILE"

      - name: Move nightly tag
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push origin nightly --force

      - name: Delete old nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null | \
            xargs -r -I{} gh release delete-asset nightly "{}" --yes || true

      - name: Create/update nightly release
        uses: softprops/action-gh-release@v3
        with:
          name: NoveLA nightly v${{ env.APP_VERSION }} (${{ env.SHORT_SHA }})
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          body_path: release-body.md
          files: release-artifacts/*.apk
