name: Nightly Build

on:
  push:
    branches:
      - default
    paths-ignore:
      - '**.md'
      - 'screenshots/**'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore APK signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/storeFile.jks

          cat > custom.properties <<EOF
          storeFile=storeFile.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Set nightly version code
        run: |
          VERSION_CODE=$(date +%s)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          sed -i "s/versionCode = [0-9]\+/versionCode = ${VERSION_CODE}/" app/build.gradle.kts

      - name: Set app version
        run: |
          echo "APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = \"\\(.*\\)\"$/\\1/p' app/build.gradle.kts | head -n 1)" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties

      - name: Collect APKs
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' \
            -exec cp {} release-artifacts/ \;
          ls -lah release-artifacts

      - name: Build changelog and move nightly tag
        run: |
          git fetch origin --tags --force

          BASE_TAG=$(git tag --sort=-creatordate | grep -v -x 'nightly' | head -n1)

          {
            echo "⚠️ Automated build from the latest commit on the \`${{ github.ref_name }}\` branch."
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Version code:** \`${VERSION_CODE}\`"
            echo ""
            echo "This is a nightly build and may contain bugs."
            echo ""

            if [ -n "$BASE_TAG" ]; then
              echo "## Changes since $BASE_TAG"
              git log --no-merges --pretty=format:'- %s (%h)' "$BASE_TAG"..HEAD | sed '/^$/d' | head -n 40
            else
              echo "## Recent changes"
              git log --no-merges -20 --pretty=format:'- %s (%h)' HEAD | sed '/^$/d'
            fi
          } > release-body.md

          git tag -f nightly "${{ github.sha }}"
          git push origin nightly --force

      - name: Delete old nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null | \
            xargs -r -I{} gh release delete-asset nightly "{}" --yes || true

      - name: Create/update nightly release
        uses: softprops/action-gh-release@v3
        with:
          name: NoveLA nightly v${{ env.APP_VERSION }} (${{ env.SHORT_SHA }})
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          body_path: release-body.md
          files: release-artifacts/*.apk
