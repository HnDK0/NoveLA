name: 🐛 App Bug / Ошибка в приложении
description: Report a bug in the NoveLA Android app (UI, Reader, TTS, Downloads, etc.)
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⭐️ **If NoveLA helps you, please consider starring the repository!**
        Ваша звезда — лучшая мотивация чинить баги и развивать проект.

  - type: textarea
    id: description
    attributes:
      label: Bug Description / Описание проблемы
      description: Clear and concise description of the bug / Чёткое описание проблемы.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce / Шаги для воспроизведения
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version / Версия приложения
      placeholder: "e.g. v1.4.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & Android Version / Устройство и версия Android
      placeholder: "e.g. Poco F3, Android 13"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stacktrace / Screenshots
      description: Attach screenshots, crash logs, or screen recordings if available.
